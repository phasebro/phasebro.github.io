  <!-- PHASE SPLASH: matrix rain + Φ logo reveal on open -->
<style>#phase-splash{z-index:99999;background:#040805;flex-direction:column;justify-content:center;align-items:center;animation:.5s 2.6s forwards phaseSplashHide;display:flex;position:fixed;inset:0;overflow:hidden}#phase-splash canvas{opacity:.55;width:100%;height:100%;position:absolute;inset:0}#phase-splash .plogo{background:linear-gradient(135deg,#00e676,#00a651 55%,#c9a227);color:#0000;filter:drop-shadow(0 0 26px #00e6768c);-webkit-background-clip:text;background-clip:text;line-height:1;animation:1.1s cubic-bezier(.2,.8,.25,1) both phaseLogoIn;position:relative}#phase-splash .pname{letter-spacing:9px;color:#fff;margin-top:10px;font-family:Outfit,system-ui,sans-serif;font-size:19px;font-weight:800;animation:1.1s cubic-bezier(.2,.8,.25,1) .15s both phaseLogoIn;position:relative}#phase-splash .ptag{letter-spacing:4px;color:#00e676;margin-top:6px;font-family:Outfit,system-ui,sans-serif;font-size:10.5px;animation:1.1s cubic-bezier(.2,.8,.25,1) .3s both phaseLogoIn;position:relative}@keyframes phaseLogoIn{0%{opacity:0;filter:blur(6px);transform:scale(.82)}to{opacity:1;filter:blur();transform:scale(1)}}@keyframes phaseSplashHide{to{opacity:0;visibility:hidden;pointer-events:none}}@media (prefers-reduced-motion:reduce){#phase-splash{display:none}}#phase-splash .plogo img{filter:drop-shadow(0 0 26px #00e6768c);width:190px;height:190px;display:block}</style>
<div id="phase-splash" aria-hidden="true">
  <canvas id="phase-matrix"></canvas>
  <div class="plogo"><img src="logo.png" alt="Phase"></div>
  <div class="pname">PHASE</div>
  <div class="ptag">ONCHAIN YOUR DREAMS</div>
</div>
<script>
(function(){
  try{
    var splash=document.getElementById('phase-splash'), cv=document.getElementById('phase-matrix');
    if(!splash||!cv){return;}
    if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches){splash.remove();return;}
    var ctx=cv.getContext('2d'), W, H, cols, drops;
    var chars='Φ01<>/{}#$01Φ10';
    function size(){ W=cv.width=window.innerWidth; H=cv.height=window.innerHeight; cols=Math.floor(W/18); drops=[]; for(var i=0;i<cols;i++){ drops[i]=Math.random()*-40; } }
    size(); window.addEventListener('resize',size);
    ctx.font='15px monospace';
    var start=Date.now();
    var iv=setInterval(function(){
      ctx.fillStyle='rgba(4,8,5,0.16)'; ctx.fillRect(0,0,W,H);
      for(var i=0;i<cols;i++){
        var ch=chars[Math.floor(Math.random()*chars.length)];
        var x=i*18, y=drops[i]*18;
        ctx.fillStyle=Math.random()<0.06?'#c9a227':'#00e676';
        ctx.fillText(ch,x,y);
        ctx.fillStyle='rgba(0,166,81,0.55)';
        if(y>H&&Math.random()>0.976){ drops[i]=0; }
        drops[i]++;
      }
      if(Date.now()-start>2100){ clearInterval(iv); }
    },42);
    function kill(){ if(splash&&splash.parentNode){ splash.parentNode.removeChild(splash); } clearInterval(iv); }
    splash.addEventListener('click',kill);
    setTimeout(kill,2750);
  }catch(e){ var s=document.getElementById('phase-splash'); if(s){ s.style.display='none'; } }
})();
</script>
